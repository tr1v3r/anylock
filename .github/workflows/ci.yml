name: CI

on:
  push:
    branches: [master]
  pull_request:

# Validate each module against its declared released dependencies during API migrations.
env:
  GOWORK: 'off'

jobs:
  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', 'driver/memory', 'driver/postgres', 'driver/redis', 'integration']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: '**/go.sum'
      - name: Test every module against its declared dependencies with race detection
        run: ./scripts/modules.sh go test -race -count=1 ./...
      - name: Coverage for every module
        run: ./scripts/modules.sh go test -count=1 -coverprofile=coverage.out ./...
      - name: Report coverage per module
        run: ./scripts/modules.sh sh -c 'go tool cover -func=coverage.out | tail -1'

  standalone:
    name: Standalone modules
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Verify each module is tidy without workspace replacements
        run: ./scripts/modules.sh go mod tidy -diff
      - name: Core has no external module dependencies
        run: test "$(go list -m all | wc -l)" -eq 1
      - name: Test standalone modules, including integration-tag compilation
        run: ./scripts/modules.sh go test -race -count=1 -tags=integration ./...

  redis:
    name: Redis integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Test all modules against real Redis
        env:
          ANYLOCK_REDIS_ADDR: 127.0.0.1:6379
        run: ./scripts/modules.sh go test -race -count=1 -tags=integration ./...
